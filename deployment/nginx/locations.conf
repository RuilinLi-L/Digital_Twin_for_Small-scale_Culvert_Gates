index index.html;
charset utf-8;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
gzip on;
gzip_types application/javascript application/json model/gltf+json text/css;

location = /__health {
    default_type application/json;
    return 200 '{"status":"ok","component":"frontend","backend_configured":false}';
}

# 数据库恢复并验证后，替换为 proxy_pass http://127.0.0.1:8000; 保留原请求路径。
location /api/ {
    default_type application/json;
    return 503 '{"error":"backend_not_configured"}';
}

location ~ /\. {
    return 404;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
}

location /models/ {
    try_files $uri =404;
    expires 5m;
}

location /draco/ {
    try_files $uri =404;
    expires 5m;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location / {
    try_files $uri $uri/ /index.html;
}
